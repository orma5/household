name: Homelab build and push
on: [push]

jobs:
  code-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DJANGO_SETTINGS_MODULE: settings.test
        run: |
          python manage.py test

      - name: Dependency check with pip-audit
        run: |
          pip-audit
  
  build:
    runs-on: ubuntu-latest
    needs: code-checks
    steps:
      # 1. Login to YOUR Homelab Registry
      - name: Login to Homelab Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 2. Build and push a multi-arch image: amd64 (x86 tier) + arm64 (Pi/k3s tier).
      #    Immutable tag = commit SHA (the CD contract). :latest kept during transition.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}/${{ secrets.DOCKERHUB_REPO }}:latest